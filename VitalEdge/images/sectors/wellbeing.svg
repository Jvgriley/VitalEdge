<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="HEALTH &amp; WELLBEING placeholder image">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="55%" stop-color="#0c1228"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- corner frame ticks -->
  <g stroke="#34d399" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M28,64 V28 H64"/>
    <path d="M772,64 V28 H736"/>
    <path d="M28,536 V572 H64"/>
    <path d="M772,536 V572 H736"/>
  </g>

  <!-- icon -->
  <g transform="translate(400,300)" opacity="0.92">
    
      <path d="M0,42 C-54,4 -46,-42 -12,-42 C0,-42 0,-28 0,-28 C0,-28 0,-42 12,-42 C46,-42 54,4 0,42 Z"
            fill="none" stroke="url(#iconGrad)" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M-30,0 H-10 L-3,-14 L6,14 L13,0 H30" fill="none" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
    
  </g>

  <!-- index eyebrow -->

  <!-- label -->

  <!-- placeholder watermark -->
  <text x="736" y="46" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2"
        fill="#a0a0a8" fill-opacity="0.5">PLACEHOLDER</text>
</svg>