      <path d="M0,28 V52 M-24,64 H24" stroke="url(#iconGrad)" stroke-width="3" stroke-linecap="round"/>
      <path d="M-18,58 H18 L14,64 H-14 Z" fill="url(#iconGrad)" opacity="0.85"/>
    
